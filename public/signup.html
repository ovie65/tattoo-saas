<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — INK</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/index.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/index.css" />
<style>
  :root {
    --bg: #ffffff;
    --ink: #0a0a0a;
    --muted: #6b6b6b;
    --line: #e5e5e5;
    --accent: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 420px; width: 100%; }
  .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: .25em;
    margin-bottom: 48px;
    text-align: center;
  }
  .logo span { color: var(--accent); }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 8px;
    text-align: center;
    letter-spacing: -.02em;
  }
  .sub {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 36px;
  }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--ink);
  }
  input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid var(--ink);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(220,38,38,.1);
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .1em;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: inherit;
  }
  .btn-primary {
    background: var(--ink);
    color: #fff;
  }
  .btn-primary:hover { background: #000; transform: translateY(-1px); }
  .btn-primary:disabled { background: #ccc; cursor: not-allowed; transform: none; }
  .btn-google {
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  .btn-google:hover { background: #fafafa; }
  .btn-google svg { flex-shrink: 0; }
  .error {
    background: rgba(220,38,38,.08);
    color: var(--accent);
    padding: 12px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 16px;
    text-align: center;
    display: none;
    border: 1px solid rgba(220,38,38,.2);
  }
  .back {
    display: block;
    text-align: center;
    margin-top: 28px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    transition: color .2s;
  }
  .back:hover { color: var(--ink); }
  .footer-note {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 20px;
    line-height: 1.5;
  }
  .footer-note a { color: var(--ink); text-decoration: underline; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">INK<span>.</span></div>
  <h1>Create Account</h1>
  <p class="sub">Your studio. Your schedule. Your rules.</p>

  <div class="error" id="errorMsg"></div>

  <form id="signupForm">
    <div class="field">
      <label for="name">Studio / Artist Name</label>
      <input type="text" id="name" name="name" required placeholder="e.g. Ink Studio" autocomplete="name" />
    </div>
    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required placeholder="Min 6 characters" minlength="6" autocomplete="new-password" />
    </div>

    <button type="submit" class="btn btn-primary" id="submitBtn">Create Account</button>
  </form>

  <div class="divider">or</div>

  <button type="button" class="btn btn-google" id="googleBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Sign up with Google
  </button>

  <a href="index.html" class="back">← Back to Home</a>

  <p class="footer-note">By signing up, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
</div>

<script>
  const form = document.getElementById('signupForm');
  const btn = document.getElementById('submitBtn');
  const errorMsg = document.getElementById('errorMsg');
  const googleBtn = document.getElementById('googleBtn');

  function sanitize(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Creating...';

    const data = {
      name: sanitize(document.getElementById('name').value.trim()),
      email: sanitize(document.getElementById('email').value.trim()),
      password: document.getElementById('password').value
    };

    if (data.password.length < 6) {
      errorMsg.textContent = 'Password must be at least 6 characters.';
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Create Account';
      return;
    }

    try {
      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      
      const result = await res.json();
      
      if (!res.ok) {
        throw new Error(result.error || 'Something went wrong');
      }

      window.location.href = 'index.html';
    } catch (err) {
      errorMsg.textContent = err.message;
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  });

  googleBtn.addEventListener('click', () => {
    errorMsg.textContent = 'Google Sign-Up coming soon. Please use the form above.';
    errorMsg.style.display = 'block';
  });
</script>

</body>
</html>

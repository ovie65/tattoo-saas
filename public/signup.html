<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — INK</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/index.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/index.css" />
<style>
  :root {
    --bg: #ffffff; --ink: #0a0a0a; --muted: #6b6b6b; --accent: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .container { max-width: 400px; width: 100%; }
  .logo { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: .25em; margin-bottom: 40px; text-align: center; }
  .logo span { color: var(--accent); }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; margin-bottom: 8px; text-align: center; }
  .sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 32px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  input { width: 100%; padding: 14px; border: 1px solid var(--ink); border-radius: 8px; font-size: 14px; font-family: inherit; }
  input:focus { outline: none; border-color: var(--accent); }
  .btn { width: 100%; padding: 14px; background: var(--ink); color: #fff; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; margin-top: 8px; transition: background .2s; }
  .btn:hover { background: var(--accent); }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .error { background: rgba(220,38,38,.1); color: var(--accent); padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; text-align: center; display: none; }
  .back { display: block; text-align: center; margin-top: 24px; font-size: 13px; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--ink); }
</style>
</head>
<body>

<div class="container">
  <div class="logo">INK<span>.</span></div>
  <h1>Create Account</h1>
  <p class="sub">Start your tattoo business today.</p>

  <div class="error" id="errorMsg"></div>

  <form id="signupForm">
    <div class="field">
      <label>Studio / Artist Name</label>
      <input type="text" id="name" required placeholder="e.g. Ink Studio" />
    </div>
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="email" required placeholder="you@example.com" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" required placeholder="Min 6 characters" minlength="6" />
    </div>
    <button type="submit" class="btn" id="submitBtn">Create Account</button>
  </form>

  <a href="index.html" class="back">← Back to Home</a>
</div>

<script>
  const form = document.getElementById('signupForm');
  const btn = document.getElementById('submitBtn');
  const errorMsg = document.getElementById('errorMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Creating...';

    const data = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    };

    try {
      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      
      const result = await res.json();
      
      if (!res.ok) {
        throw new Error(result.error || 'Something went wrong');
      }

      alert('Account created! Welcome to INK.');
      window.location.href = 'index.html'; 
    } catch (err) {
      errorMsg.textContent = err.message;
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set New Password — INK</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/index.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/index.css" />
<style>
  :root { --bg: #ffffff; --ink: #0a0a0a; --muted: #6b6b6b; --line: #e5e5e5; --accent: #dc2626; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; -webkit-font-smoothing: antialiased; }
  .container { max-width: 420px; width: 100%; }
  .logo { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: .25em; margin-bottom: 48px; text-align: center; }
  .logo span { color: var(--accent); }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; margin-bottom: 8px; text-align: center; letter-spacing: -.02em; }
  .sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 36px; line-height: 1.5; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); }
  input { width: 100%; padding: 14px 16px; border: 1px solid var(--ink); border-radius: 10px; font-size: 14px; font-family: inherit; background: var(--bg); transition: border-color .2s, box-shadow .2s; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(220,38,38,.1); }
  
  .btn { width: 100%; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: inherit; }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-primary:hover { background: #000; transform: translateY(-1px); }
  .btn-primary:disabled { background: #ccc; cursor: not-allowed; transform: none; }
  
  .error { background: rgba(220,38,38,.08); color: var(--accent); padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; text-align: center; display: none; border: 1px solid rgba(220,38,38,.2); }
  .success { background: rgba(16,185,129,.08); color: #059669; padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; text-align: center; display: none; border: 1px solid rgba(16,185,129,.2); }
  
  .back { display: block; text-align: center; margin-top: 28px; font-size: 13px; color: var(--muted); text-decoration: none; transition: color .2s; }
  .back:hover { color: var(--ink); }
</style>
</head>
<body>

<div class="container">
  <div class="logo">INK<span>.</span></div>
  <h1>Set New Password</h1>
  <p class="sub">Please enter your new password below.</p>

  <div class="error" id="errorMsg"></div>
  <div class="success" id="successMsg"></div>

  <form id="resetForm">
    <div class="field">
      <label for="password">New Password</label>
      <input type="password" id="password" name="password" required placeholder="Minimum 8 characters" minlength="8" />
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm New Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Re-enter your new password" minlength="8" />
    </div>

    <button type="submit" class="btn btn-primary" id="submitBtn">Update Password</button>
  </form>

  <a href="login.html" class="back">← Back to Login</a>
</div>

<script>
  const form = document.getElementById('resetForm');
  const btn = document.getElementById('submitBtn');
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');

  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if (!token) {
    errorMsg.textContent = 'This password reset link is invalid or has expired.';
    errorMsg.style.display = 'block';
    form.style.display = 'none';
  }

  function sanitize(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
      errorMsg.textContent = 'Passwords do not match.';
      errorMsg.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Updating...';

    const data = {
      action: 'reset',
      token: token,
      password: password
    };

    try {
      const res = await fetch('/api/password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      
      const result = await res.json();
      
      if (!res.ok) {
        throw new Error(result.error || 'Failed to reset password');
      }

      successMsg.textContent = 'Password updated successfully! Redirecting to login...';
      successMsg.style.display = 'block';
      form.style.display = 'none';

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);

    } catch (err) {
      errorMsg.textContent = err.message;
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Update Password';
    }
  });
</script>


</body>
</html>

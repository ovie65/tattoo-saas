<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edit My Site — INK</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/index.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/index.css" />
<style>
  :root { --bg: #ffffff; --bg-alt: #f7f7f7; --ink: #0a0a0a; --muted: #6b6b6b; --line: #e5e5e5; --accent: #dc2626; --radius: 12px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg-alt); color: var(--ink); font-family: 'Inter', sans-serif; min-height: 100vh; }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: -.02em; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  a { text-decoration: none; color: inherit; }
  .container { max-width: 700px; margin: 0 auto; padding: 60px 20px; }
  .header { margin-bottom: 40px; }
  .header h1 { font-size: 32px; margin-bottom: 8px; }
  .header p { color: var(--muted); font-size: 14px; }
  .debug-box { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; font-weight: 600; text-align: center; border: 1px solid #fecaca; }
  .form-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 32px; margin-bottom: 24px; }
  .form-card h2 { font-size: 18px; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .field { margin-bottom: 20px; }
  label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .04em; }
  .hint { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  input, textarea { width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--bg); }
  textarea { resize: vertical; min-height: 100px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .btn-save { width: 100%; padding: 16px; background: var(--ink); color: #fff; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .btn-save:hover { background: #000; }
  .btn-back { display: block; text-align: center; margin-top: 20px; font-size: 14px; color: var(--muted); }
  .notice { padding: 14px; border-radius: 10px; font-size: 13px; margin-bottom: 24px; text-align: center; display: none; }
  .notice.success { background: rgba(16,185,129,.08); color: #059669; border: 1px solid rgba(16,185,129,.2); display: block; }
  .notice.error { background: rgba(220,38,38,.08); color: var(--accent); border: 1px solid rgba(220,38,38,.2); display: block; }
  .faq-item { background: var(--bg-alt); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; position: relative; }
  .faq-item input { min-height: 40px; font-weight: 600; margin-bottom: 12px; }
  .faq-item textarea { min-height: 80px; }
  .btn-remove { position: absolute; top: 12px; right: 12px; color: var(--accent); font-size: 12px; font-weight: 600; }
  .btn-add { width: 100%; padding: 12px; border: 2px dashed var(--line); border-radius: 8px; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; cursor: pointer; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="container">
  <div id="debugStatus" class="debug-box">Checking username...</div>

  <div class="header">
    <h1>Edit My Site</h1>
    <p>Customize your public artist page.</p>
  </div>

  <div class="notice" id="notice"></div>

  <form id="editForm">
    <div class="form-card">
      <h2>About Section</h2>
      <div class="field"><label>Artist Bio</label><textarea id="bio" placeholder="With over a decade..."></textarea></div>
    </div>
    <div class="form-card">
      <h2>Stats</h2>
      <div class="row">
        <div class="field"><label>Years</label><input type="text" id="yearsExp" placeholder="10+" /></div>
        <div class="field"><label>Pieces</label><input type="text" id="piecesDone" placeholder="2K+" /></div>
        <div class="field"><label>Standard</label><input type="text" id="sterile" placeholder="100%" /></div>
      </div>
    </div>
    <div class="form-card">
      <h2>Studio Info</h2>
      <div class="field"><label>Location</label><textarea id="location" style="min-height: 80px;"></textarea></div>
      <div class="field"><label>Hours</label><textarea id="hours" style="min-height: 80px;"></textarea></div>
      <div class="field"><label>Hygiene</label><textarea id="hygiene" style="min-height: 80px;"></textarea></div>
    </div>
    <div class="form-card">
      <h2>FAQ</h2>
      <div class="hint">Add, edit, or remove questions.</div>
      <div id="faqContainer"></div>
      <button type="button" class="btn-add" onclick="addFaq()">+ Add Question</button>
    </div>
    <button type="submit" class="btn-save" id="saveBtn">Save Changes</button>
  </form>
  <a href="dashboard.html" class="btn-back">← Back to Dashboard</a>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const urlUser = urlParams.get('user');
  const storageUser = localStorage.getItem('ink_user_name');
  const userName = urlUser || storageUser;

  const debugBox = document.getElementById('debugStatus');
  if (userName) {
    debugBox.innerText = '✅ Detected Username: ' + userName;
    debugBox.style.background = '#dcfce7';
    debugBox.style.color = '#166534';
    debugBox.style.borderColor = '#bbf7d0';
  } else {
    debugBox.innerText = '❌ No Username Found! URL: ' + window.location.href;
  }

  const form = document.getElementById('editForm');
  const saveBtn = document.getElementById('saveBtn');
  const notice = document.getElementById('notice');
  const faqContainer = document.getElementById('faqContainer');

  let currentFaqs = [{ q: "How do I book?", a: "Click Book Now." }];

  function renderFaqs() {
    faqContainer.innerHTML = '';
    currentFaqs.forEach((faq, index) => {
      const div = document.createElement('div');
      div.className = 'faq-item';
      div.innerHTML = `
        <button type="button" class="btn-remove" onclick="removeFaq(${index})">Remove</button>
        <input type="text" placeholder="Question" value="${faq.q}" oninput="updateFaq(${index}, 'q', this.value)" />
        <textarea placeholder="Answer" oninput="updateFaq(${index}, 'a', this.value)">${faq.a}</textarea>
      `;
      faqContainer.appendChild(div);
    });
  }

  window.addFaq = function() { currentFaqs.push({ q: "", a: "" }); renderFaqs(); };
  window.removeFaq = function(index) { currentFaqs.splice(index, 1); renderFaqs(); };
  window.updateFaq = function(index, field, value) { currentFaqs[index][field] = value; };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    // LOG what we're about to send
    console.log('=== SAVING PROFILE ===');
    console.log('Username:', userName);
    console.log('Full data object:', {
      username: userName,
      bio: document.getElementById('bio').value,
      yearsExp: document.getElementById('yearsExp').value,
      piecesDone: document.getElementById('piecesDone').value,
      sterile: document.getElementById('sterile').value,
      location: document.getElementById('location').value,
      hours: document.getElementById('hours').value,
      hygiene: document.getElementById('hygiene').value,
      faq: currentFaqs
    });

    if (!userName) { 
      notice.textContent = 'Error: No username detected';
      notice.className = 'notice error';
      return; 
    }
    
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    const data = {
      username: userName,
      bio: document.getElementById('bio').value,
      yearsExp: document.getElementById('yearsExp').value,
      piecesDone: document.getElementById('piecesDone').value,
      sterile: document.getElementById('sterile').value,
      location: document.getElementById('location').value,
      hours: document.getElementById('hours').value,
      hygiene: document.getElementById('hygiene').value,
      faq: currentFaqs
    };

    console.log('Sending to API:', JSON.stringify(data));

    try {
      const res = await fetch('/api/save-artist-profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      
      const result = await res.json();
      console.log('API Response:', result);
      
      if (!res.ok) {
        throw new Error(result.error || 'Failed to save');
      }
      
      notice.textContent = '✅ Saved successfully!';
      notice.className = 'notice success';
      saveBtn.textContent = 'Saved!';
      setTimeout(() => { saveBtn.disabled = false; saveBtn.textContent = 'Save Changes'; }, 2000);
    } catch (err) {
      notice.textContent = 'Error: ' + err.message;
      notice.className = 'notice error';
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Changes';
    }
  });

  renderFaqs();
</script>
</body>
</html>

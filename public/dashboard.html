<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — INK</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/index.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/index.css" />
<style>
  :root {
    --bg: #ffffff;
    --bg-alt: #f7f7f7;
    --ink: #0a0a0a;
    --muted: #6b6b6b;
    --line: #e5e5e5;
    --accent: #dc2626;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg-alt); color: var(--ink); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: -.02em; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  .top-nav {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-logo { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: .2em; }
  .nav-logo span { color: var(--accent); }
  .nav-user { display: flex; align-items: center; gap: 16px; }
  .nav-user-name { font-size: 14px; font-weight: 600; }
  .btn-logout { font-size: 13px; color: var(--muted); font-weight: 600; transition: color .2s; }
  .btn-logout:hover { color: var(--accent); }

  .container { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
  
  .page-header { margin-bottom: 32px; }
  .page-header h1 { font-size: 28px; margin-bottom: 4px; }
  .page-header p { color: var(--muted); font-size: 14px; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 40px;
  }
  .stat-card {
    background: #fff;
    padding: 24px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
  }
  .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-bottom: 8px; }
  .stat-value { font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; }
  .stat-value.accent { color: var(--accent); }

  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .section-header h2 { font-size: 20px; }
  .badge { background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 100px; }

  .booking-list { display: flex; flex-direction: column; gap: 12px; }
  
  .booking-card {
    background: #fff;
    border-radius: var(--radius);
    padding: 24px;
    border: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    transition: border-color .2s;
  }
  .booking-card:hover { border-color: var(--ink); }
  
  .booking-info { flex: 1; }
  .booking-client { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .booking-desc { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
  .booking-meta { display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .booking-meta span { display: flex; align-items: center; gap: 6px; }

  .booking-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn { padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; transition: all .2s; }
  .btn-accept { background: var(--ink); color: #fff; }
  .btn-accept:hover { background: #000; transform: translateY(-1px); }
  .btn-decline { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn-decline:hover { border-color: var(--accent); color: var(--accent); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); background: #fff; border-radius: var(--radius); border: 1px solid var(--line); }

  @media (max-width: 768px) {
    .booking-card { flex-direction: column; align-items: flex-start; }
    .booking-actions { width: 100%; }
    .booking-actions .btn { flex: 1; text-align: center; }
    .nav-user-name { display: none; }
  }
</style>
</head>
<body>

<nav class="top-nav">
  <div class="nav-logo">INK<span>.</span></div>
  <div class="nav-user">
    <span class="nav-user-name">Loading...</span>
    <button class="btn-logout" id="logoutBtn">Log Out</button>
  </div>
</nav>

<main class="container">
  <div class="page-header">
    <h1>Dashboard</h1>
    <p>Manage your bookings and studio.</p>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Pending</div>
      <div class="stat-value accent" id="statPending">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Accepted</div>
      <div class="stat-value" id="statAccepted">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Declined</div>
      <div class="stat-value" id="statDeclined">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Requests</div>
      <div class="stat-value" id="statTotal">0</div>
    </div>
  </div>

  <div class="section-header">
    <h2>Booking Requests</h2>
    <span class="badge" id="badgePending">0 New</span>
  </div>

  <div class="booking-list" id="bookingList">
    <div class="empty-state" id="emptyState">Loading bookings...</div>
  </div>
</main>

<script>
  // 1. Check if user is logged in
  const userEmail = localStorage.getItem('ink_user_email');
  const userName = localStorage.getItem('ink_user_name');

  if (!userEmail) {
    window.location.href = 'login.html';
  } else {
    document.querySelector('.nav-user-name').textContent = userName;
  }

  // 2. Logout functionality
  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('ink_user_email');
    localStorage.removeItem('ink_user_name');
    window.location.href = 'login.html';
  });

  // 3. Fetch real bookings from the database
  async function loadBookings() {
    const listContainer = document.getElementById('bookingList');
    const emptyState = document.getElementById('emptyState');
    
    try {
      // Fetch ALL bookings from the API
      const res = await fetch('/api/get-bookings');
      const data = await res.json();

      if (!data.success || !data.bookings || data.bookings.length === 0) {
        emptyState.style.display = 'block';
        emptyState.textContent = 'No booking requests yet. Share your INK link to get started!';
        return;
      }

      // Hide empty state and clear container
      emptyState.style.display = 'none';
      listContainer.innerHTML = '';

      let pendingCount = 0;
      let acceptedCount = 0;
      let declinedCount = 0;

      // Loop through bookings and build the HTML
      data.bookings.forEach(booking => {
        if (booking.status === 'pending') pendingCount++;
        if (booking.status === 'accepted') acceptedCount++;
        if (booking.status === 'declined') declinedCount++;

        const card = document.createElement('div');
        card.className = 'booking-card';
        
        // Format the date nicely
        const dateObj = new Date(booking.date);
        const dateStr = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

        card.innerHTML = `
          <div class="booking-info">
            <div class="booking-client">${booking.clientName} <span style="font-weight:400; font-size:13px; color:var(--muted)">(${booking.clientEmail})</span></div>
            <div class="booking-desc">${booking.description}</div>
            <div class="booking-meta">
              <span> ${dateStr}</span>
              <span> ${booking.placement}</span>
              <span style="text-transform: capitalize; font-weight: 600; color: ${booking.status === 'pending' ? 'var(--accent)' : 'var(--ink)'}">● ${booking.status}</span>
            </div>
          </div>
          <div class="booking-actions">
            ${booking.status === 'pending' ? `
              <button class="btn btn-decline" onclick="updateBooking('${booking._id}', 'declined')">Decline</button>
              <button class="btn btn-accept" onclick="updateBooking('${booking._id}', 'accepted')">Accept</button>
            ` : ''}
          </div>
        `;
        listContainer.appendChild(card);
      });

      // Update stats
      document.getElementById('statPending').textContent = pendingCount;
      document.getElementById('statAccepted').textContent = acceptedCount;
      document.getElementById('statDeclined').textContent = declinedCount;
      document.getElementById('statTotal').textContent = data.bookings.length;
      document.getElementById('badgePending').textContent = `${pendingCount} New`;

    } catch (error) {
      console.error('Error loading bookings:', error);
      emptyState.style.display = 'block';
      emptyState.textContent = 'Failed to load bookings. Please refresh.';
    }
  }

  // 4. Function to Accept or Decline (We will build the API for this next)
  window.updateBooking = async function(bookingId, newStatus) {
    if (!confirm(`Are you sure you want to ${newStatus} this booking?`)) return;

    try {
      const res = await fetch('/api/update-booking', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: bookingId, status: newStatus })
      });
      
      if (res.ok) {
        loadBookings(); // Reload the list
      } else {
        alert('Failed to update booking.');
      }
    } catch (error) {
      alert('Error updating booking.');
    }
  };

  // Load bookings when page opens
  loadBookings();
</script>

</body>
</html>

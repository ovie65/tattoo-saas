<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — INK</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/index.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/index.css" />
<style>
  :root {
    --bg: #ffffff;
    --ink: #0a0a0a;
    --muted: #6b6b6b;
    --line: #e5e5e5;
    --accent: #dc2626;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --sidebar-bg: #fafafa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  
  /* Sidebar */
  .sidebar {
    width: 240px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--line);
    padding: 24px 0;
    position: fixed;
    height: 100vh;
    overflow-y: auto;
  }
  .sidebar-logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .2em;
    padding: 0 24px;
    margin-bottom: 40px;
  }
  .sidebar-logo span { color: var(--accent); }
  .nav-item {
    display: block;
    padding: 12px 24px;
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: all .2s;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { color: var(--ink); background: #f0f0f0; }
  .nav-item.active {
    color: var(--ink);
    background: var(--ink);
    color: #fff;
    border-left-color: var(--accent);
  }

  /* Main Content */
  .main {
    margin-left: 240px;
    flex: 1;
    padding: 40px;
    max-width: 1200px;
  }
  .header { margin-bottom: 32px; }
  .header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .header p { color: var(--muted); font-size: 14px; }

  /* Share Box */
  .share-box {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    gap: 20px;
  }
  .share-info h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .share-info p { color: var(--muted); font-size: 13px; }
  .share-link-container {
    display: flex;
    align-items: center;
    background: var(--sidebar-bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px;
    flex: 1;
    max-width: 500px;
  }
  .share-link-input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 12px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    outline: none;
  }
  .copy-btn {
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
  }
  .copy-btn:hover { background: #000; }

  /* Stats Grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 40px;
  }
  .stat-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
  }
  .stat-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .stat-value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px;
    font-weight: 700;
  }
  .stat-value.pending { color: var(--accent); }
  .stat-value.accepted { color: var(--success); }
  .stat-value.declined { color: var(--danger); }

  /* Bookings Section */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .section-header h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 700;
  }
  .badge {
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
  }
  .bookings-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .booking-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .booking-info h4 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .booking-info p { font-size: 13px; color: var(--muted); }
  .booking-status {
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .status-pending { background: rgba(220,38,38,.1); color: var(--accent); }
  .status-accepted { background: rgba(16,185,129,.1); color: var(--success); }
  .status-declined { background: rgba(239,68,68,.1); color: var(--danger); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main { margin-left: 0; padding: 20px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .share-box { flex-direction: column; align-items: stretch; }
    .share-link-container { max-width: 100%; }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">INK<span>.</span></div>
  <nav>
    <a href="dashboard.html" class="nav-item active">Dashboard</a>
    <a href="dashboard.html?tab=accepted" class="nav-item">Accepted</a>
    <a href="dashboard.html?tab=drafts" class="nav-item">Drafts</a>
    <a href="dashboard.html?tab=testimonials" class="nav-item">Testimonials</a>
    <a href="dashboard.html?tab=notifications" class="nav-item">Notifications</a>
    <a href="edit-site.html" class="nav-item">Edit My Site</a>
    <a href="#" id="viewSiteLink" class="nav-item" target="_blank">View My Site</a>
  </nav>
</aside>

<main class="main">
  <div class="header">
    <h1>Dashboard</h1>
    <p>Manage your bookings and studio.</p>
  </div>

  <div class="share-box">
    <div class="share-info">
      <h3> Share Your Site</h3>
      <p>Copy your unique link to share with clients.</p>
    </div>
    <div class="share-link-container">
      <input type="text" class="share-link-input" id="shareLinkInput" readonly />
      <button class="copy-btn" id="copyLinkBtn">Copy Link</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Pending</div>
      <div class="stat-value pending" id="statPending">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Accepted</div>
      <div class="stat-value accepted" id="statAccepted">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Declined</div>
      <div class="stat-value declined" id="statDeclined">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Requests</div>
      <div class="stat-value" id="statTotal">0</div>
    </div>
  </div>

  <div class="section-header">
    <h2>Booking Requests</h2>
    <span class="badge" id="newBadge">0 New</span>
  </div>

  <div class="bookings-list" id="bookingsList">
    <div class="empty-state">Loading bookings...</div>
  </div>
</main>

<script>
  // Check authentication
  const userEmail = localStorage.getItem('userEmail');
  const userName = localStorage.getItem('userName');
  
  if (!userEmail || !userName) {
    window.location.href = 'login.html';
  }

  // Set clean URLs for links
  const cleanUrl = window.location.origin + '/' + encodeURIComponent(userName);
  
  const viewSiteLink = document.getElementById('viewSiteLink');
  if (viewSiteLink) viewSiteLink.href = cleanUrl;

  const shareLinkInput = document.getElementById('shareLinkInput');
  if (shareLinkInput) shareLinkInput.value = cleanUrl;

  // Copy Link functionality
  const copyBtn = document.getElementById('copyLinkBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(cleanUrl);
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        copyBtn.style.background = '#10b981';
        setTimeout(() => {
          copyBtn.textContent = originalText;
          copyBtn.style.background = '';
        }, 2000);
      } catch (err) {
        shareLinkInput.select();
        document.execCommand('copy');
      }
    });
  }

  // Fetch bookings
  async function loadBookings() {
    try {
      const res = await fetch('/api/get-bookings?artist=' + encodeURIComponent(userName));
      const data = await res.json();
      
      if (!res.ok) throw new Error(data.error || 'Failed to load bookings');

      const bookings = data.bookings || [];
      
      // Update stats
      const pending = bookings.filter(b => b.status === 'pending').length;
      const accepted = bookings.filter(b => b.status === 'accepted').length;
      const declined = bookings.filter(b => b.status === 'declined').length;

      document.getElementById('statPending').textContent = pending;
      document.getElementById('statAccepted').textContent = accepted;
      document.getElementById('statDeclined').textContent = declined;
      document.getElementById('statTotal').textContent = bookings.length;
      document.getElementById('newBadge').textContent = pending + ' New';

      // Render bookings
      const list = document.getElementById('bookingsList');
      if (bookings.length === 0) {
        list.innerHTML = '<div class="empty-state">No booking requests yet.</div>';
        return;
      }

      list.innerHTML = bookings.map(b => `
        <div class="booking-card">
          <div class="booking-info">
            <h4>${b.clientName || 'Unknown Client'}</h4>
            <p>${b.service || 'Tattoo Service'} • ${b.date || 'TBD'}</p>
          </div>
          <div class="booking-status status-${b.status || 'pending'}">${b.status || 'pending'}</div>
        </div>
      `).join('');

    } catch (err) {
      console.error('Error loading bookings:', err);
      document.getElementById('bookingsList').innerHTML = '<div class="empty-state">Error loading bookings.</div>';
    }
  }

  loadBookings();
</script>

</body>
</html>

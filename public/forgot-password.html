<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — INK</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/index.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/index.css" />
<style>
  :root { --bg: #ffffff; --ink: #0a0a0a; --muted: #6b6b6b; --line: #e5e5e5; --accent: #dc2626; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; -webkit-font-smoothing: antialiased; }
  .container { max-width: 420px; width: 100%; }
  .logo { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: .25em; margin-bottom: 48px; text-align: center; }
  .logo span { color: var(--accent); }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; margin-bottom: 8px; text-align: center; letter-spacing: -.02em; }
  .sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 36px; line-height: 1.5; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); }
  input { width: 100%; padding: 14px 16px; border: 1px solid var(--ink); border-radius: 10px; font-size: 14px; font-family: inherit; background: var(--bg); transition: border-color .2s, box-shadow .2s; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(220,38,38,.1); }
  
  .btn { width: 100%; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: inherit; }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-primary:hover { background: #000; transform: translateY(-1px); }
  .btn-primary:disabled { background: #ccc; cursor: not-allowed; transform: none; }
  
  /* Professional Info Message */
  .info-msg { 
    background: rgba(59, 130, 246, 0.08); 
    color: #1d4ed8; 
    padding: 16px; 
    border-radius: 10px; 
    font-size: 13px; 
    margin-bottom: 24px; 
    text-align: center; 
    display: none; 
    border: 1px solid rgba(59, 130, 246, 0.2); 
    line-height: 1.5;
  }

  .back { display: block; text-align: center; margin-top: 28px; font-size: 13px; color: var(--muted); text-decoration: none; transition: color .2s; }
  .back:hover { color: var(--ink); }
</style>
</head>
<body>

<div class="container">
  <div class="logo">INK<span>.</span></div>
  <h1>Reset Password</h1>
  <p class="sub">Enter the email address associated with your account and we'll send you a link to reset your password.</p>

  <!-- This message appears after they submit, regardless of whether the email exists -->
  <div class="info-msg" id="infoMsg">
    If an account with that email is registered with us, you will receive a password reset link shortly. Please check your inbox and spam folder.
  </div>

  <form id="forgotForm">
    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email" />
    </div>

    <button type="submit" class="btn btn-primary" id="submitBtn">Send Reset Link</button>
  </form>

  <a href="login.html" class="back">← Back to Login</a>
</div>

<script>
  const form = document.getElementById('forgotForm');
  const btn = document.getElementById('submitBtn');
  const infoMsg = document.getElementById('infoMsg');

  function sanitize(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    // Hide message if it was shown before
    infoMsg.style.display = 'none';
    
    btn.disabled = true;
    btn.textContent = 'Sending...';

    const data = {
      email: sanitize(document.getElementById('email').value.trim())
    };

    try {
      const res = await fetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      
      // We don't even need to check if res.ok is true or false for the UI.
      // We show the exact same professional message either way to prevent email enumeration.
      
      infoMsg.style.display = 'block';
      form.style.display = 'none'; // Hide the form so they can't spam the button
      
    } catch (err) {
      // Even if the network fails, we show the message for security
      infoMsg.style.display = 'block';
      form.style.display = 'none';
    }
  });
</script>

</body>
</html>
